name: Build, publish e deploy para MonsterASP.NET

# Só roda em push na main (deploy de producao) ou manualmente pelo Actions.
# Branches de feature/PR nao disparam deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: "9.0.x"
  SOLUTION_PATH: ControleFamiliarAPI/ControleFamiliarAPI.sln
  PROJECT_PATH: ControleFamiliarAPI/ControleFamiliarAPI/ControleFamiliarAPI.csproj
  PROJECT_DIR: ControleFamiliarAPI/ControleFamiliarAPI
  PUBLISH_OUTPUT: ./publish

jobs:
  build_and_deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef

      # Aplica as migrations pendentes direto no banco de producao antes do
      # deploy. Program.cs valida ConnectionStrings:DefaultConnection e
      # Jwt:Key na inicializacao (mesmo o design-time host do dotnet-ef
      # passa por esse trecho), por isso as duas env vars sao necessarias
      # aqui, nao so no passo de publish.
      - name: Apply database migrations
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.DB_CONNECTION_STRING }}
          Jwt__Key: ${{ secrets.JWT_KEY }}
        run: dotnet ef database update --configuration Release

      # win-x86 e o padrao recomendado pelo MonsterASP.NET (app pool 32-bit
      # na maioria dos planos). Se o painel indicar app pool 64-bit, troque
      # para win-x64 aqui.
      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          --configuration Release
          --output ${{ env.PUBLISH_OUTPUT }}
          --runtime win-x86
          --self-contained false

      # MonsterASP.NET e hospedagem compartilhada: o painel nao da acesso a
      # variaveis de ambiente do servidor. Sem ASPNETCORE_ENVIRONMENT
      # definido, o ASP.NET Core assume "Production" por padrao e carrega
      # appsettings.Production.json automaticamente por cima do
      # appsettings.json — e nesse arquivo publicado que os segredos sao
      # gravados a cada deploy. O appsettings.Production.json versionado no
      # repo so tem placeholders vazios; os valores reais nunca ficam no
      # codigo-fonte.
      - name: Injetar segredos de produção no appsettings.Production.json
        shell: pwsh
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          WEB_ORIGIN: ${{ secrets.WEB_ORIGIN }}
        run: |
          $path = Join-Path $env:PUBLISH_OUTPUT "appsettings.Production.json"
          $json = Get-Content $path -Raw | ConvertFrom-Json

          $json.ConnectionStrings.DefaultConnection = $env:DB_CONNECTION_STRING
          $json.Jwt.Key = $env:JWT_KEY
          $json.Cors.AllowedOrigins = @($env:WEB_ORIGIN)

          $json | ConvertTo-Json -Depth 10 | Set-Content $path

      # Libera os locks de arquivo do IIS antes de sobrescrever o app.
      - name: Take app offline (release IIS file locks)
        run: |
          echo "App temporarily offline for deployment." > app_offline.htm
          curl --ftp-pasv -T app_offline.htm --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/wwwroot/app_offline.htm"

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /wwwroot/

      - name: Bring app back online
        run: |
          curl --ftp-pasv --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -Q "DELE /wwwroot/app_offline.htm" "ftp://${{ secrets.FTP_SERVER }}/"
