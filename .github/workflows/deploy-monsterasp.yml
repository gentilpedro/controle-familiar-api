name: Build, publish e deploy para MonsterASP.NET

# Só roda em push na main (deploy de producao) ou manualmente pelo Actions.
# Branches de feature/PR nao disparam deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: "9.0.x"
  SOLUTION_PATH: ControleFamiliarAPI.sln
  PROJECT_PATH: ControleFamiliarAPI/ControleFamiliarAPI.csproj
  PUBLISH_OUTPUT: ./publish

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      # Se algum teste falhar, o workflow para aqui — Publish/Deploy não
      # rodam. ControleFamiliarAPI.Tests cobre autenticação, isolamento por
      # família e as regras de negócio mais sensíveis.
      - name: Test
        run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build

      # Diferente do padrão usado no Representantes_API: lá as migrations
      # rodam aqui no CI porque o banco (Postgres) aceita conexão externa.
      # O MSSQL free do MonsterASP.NET só aceita "Local access" — conexão
      # de dentro do próprio datacenter deles — então um runner do GitHub
      # nunca conseguiria alcançar o banco. Por isso a aplicação aplica as
      # migrations sozinha ao subir (ver Program.cs), e esse passo não existe
      # aqui.

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ${{ env.PUBLISH_OUTPUT }}

      # MonsterASP.NET é hospedagem compartilhada: o painel não dá acesso a
      # variáveis de ambiente do servidor/IIS diretamente. Sem
      # ASPNETCORE_ENVIRONMENT definido, o ASP.NET Core assume "Production"
      # por padrão e carrega appsettings.Production.json por cima do
      # appsettings.json. O appsettings.Production.json versionado no repo
      # só tem placeholders vazios; aqui reescrevemos esse arquivo já
      # publicado com os valores reais vindos dos GitHub Secrets — eles
      # nunca ficam no código-fonte.
      - name: Injetar segredos de produção no appsettings.Production.json
        run: |
          jq --arg cs "${{ secrets.DB_CONNECTION_STRING }}" \
             --arg jwt "${{ secrets.JWT_KEY }}" \
             --arg origin "${{ secrets.WEB_ORIGIN }}" \
             --arg scalarUser "${{ secrets.SCALAR_USERNAME }}" \
             --arg scalarPassword "${{ secrets.SCALAR_PASSWORD }}" \
             --arg smtpHost "${{ secrets.SMTP_HOST }}" \
             --arg smtpPort "${{ secrets.SMTP_PORT }}" \
             --arg smtpUsername "${{ secrets.SMTP_USERNAME }}" \
             --arg smtpPassword "${{ secrets.SMTP_PASSWORD }}" \
             --arg smtpFrom "${{ secrets.SMTP_FROM }}" \
             --arg stripeSecretKey "${{ secrets.STRIPE_SECRET_KEY }}" \
             --arg stripeWebhookSecret "${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
             --arg stripePriceIndividualId "${{ secrets.STRIPE_PRICE_INDIVIDUAL_ID }}" \
             --arg stripePriceFamiliaId "${{ secrets.STRIPE_PRICE_FAMILIA_ID }}" \
             '.ConnectionStrings.DefaultConnection = $cs
              | .Jwt.Key = $jwt
              | .Cors.AllowedOrigins = [$origin]
              | .Scalar.Username = $scalarUser
              | .Scalar.Password = $scalarPassword
              | .Frontend.BaseUrl = $origin
              | .Smtp.Host = $smtpHost
              | .Smtp.Port = (if $smtpPort == "" then 587 else ($smtpPort | tonumber) end)
              | .Smtp.Username = $smtpUsername
              | .Smtp.Password = $smtpPassword
              | .Smtp.From = $smtpFrom
              | .Stripe.SecretKey = $stripeSecretKey
              | .Stripe.WebhookSecret = $stripeWebhookSecret
              | .Stripe.PriceIndividualId = $stripePriceIndividualId
              | .Stripe.PriceFamiliaId = $stripePriceFamiliaId' \
             ${{ env.PUBLISH_OUTPUT }}/appsettings.Production.json > ${{ env.PUBLISH_OUTPUT }}/appsettings.Production.json.tmp
          mv ${{ env.PUBLISH_OUTPUT }}/appsettings.Production.json.tmp ${{ env.PUBLISH_OUTPUT }}/appsettings.Production.json

      # Libera os locks de arquivo do IIS antes de sobrescrever o app.
      - name: Take app offline (release IIS file locks)
        run: |
          echo "App temporarily offline for deployment." > app_offline.htm
          curl --ftp-pasv -T app_offline.htm --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/wwwroot/app_offline.htm"

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /wwwroot/

      - name: Bring app back online
        run: |
          curl --ftp-pasv --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -Q "DELE /wwwroot/app_offline.htm" "ftp://${{ secrets.FTP_SERVER }}/"
